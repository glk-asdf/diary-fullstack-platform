server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: diary-backend
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 业务自定义配置
diary:
  jwt:
    # HS256 要求至少 256 位（32 字节）。此处仅供本地开发，
    # 生产环境必须通过环境变量 JWT_SECRET 覆盖，泄露等于所有账号沦陷。
    secret: ${JWT_SECRET:diary-dev-only-secret-key-change-me-in-production-2026}
    # Access Token 有效期（秒），默认 30 分钟
    access-expire-seconds: ${JWT_ACCESS_EXPIRE:1800}
    # Refresh Token 有效期（秒），默认 7 天
    refresh-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}

logging:
  level:
    com.example.diary: debug
