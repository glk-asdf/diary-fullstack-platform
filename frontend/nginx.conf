# ============================================================
# Nginx 配置：静态资源托管 + 反向代理（Nginx 同时充当"前端服务"）
#   /        → 前端构建产物（SPA 路由回退）
#   /api/    → 后端 Spring Boot
#   /files/  → MinIO 对象存储（公开只读的图片）
# ============================================================
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS 服务器。必须显式声明，因为下面用了变量形式的 proxy_pass。
    #
    # 为什么非用变量不可：nginx 对字面量 proxy_pass 只在启动时解析一次主机名并把 IP 缓存住，
    # 而后端容器重建后 IP 会变（`docker compose up -d --build` 就会触发重建），
    # 此时 nginx 仍指向旧 IP，表现为持续 502，直到手动 restart nginx。
    # 用变量后 nginx 会按 valid=10s 周期重新解析，重建后端不再需要动 nginx。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 图片上传放行到 10m，后端另有 5MB 业务校验，这里只留余量
    client_max_body_size 10m;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1k;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 后端 API ----------
    location /api/ {
        set $backend_upstream "http://backend:8080";
        # 变量形式下 nginx 透传完整原始 URI，因此 /api/v1/... 原样转发
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- MinIO 对象（图片）----------
    # 把 bucket 挂在同源 /files/ 下：浏览器无需直连 MinIO，也就不用对外暴露 9000；
    # 与之对应，后端配置 MINIO_PUBLIC_ENDPOINT=/files。
    location /files/ {
        set $minio_upstream "http://minio:9000";
        # 变量形式的 proxy_pass 无法像 proxy_pass http://minio:9000/ 那样自动剥掉前缀，
        # 因此用 rewrite 手动剥掉 /files，还原成 MinIO 期望的 /bucket/object。
        # 注意 set 必须写在 rewrite 之前：rewrite 的 break 会终止后续 rewrite 阶段指令。
        rewrite ^/files/(.*)$ /$1 break;
        proxy_pass         $minio_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # 对象内容不变，交给浏览器缓存
        expires 7d;
    }

    # ---------- 带内容哈希的静态资源，可长期缓存 ----------
    location /assets/ {
        expires 1y;
    }

    # ---------- SPA 路由回退 ----------
    # 刷新 /diary/1、/stats 等前端路由时不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
